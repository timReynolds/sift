name: Sift
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review_comment:
    types: [created, edited]
  issue_comment:
    types: [created, edited]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
        type: string
# Use this exact group across EVERY workflow/entry point that runs Sift.
concurrency:
  group: sift-${{ github.repository_id }}-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
  cancel-in-progress: false
permissions:
  contents: read
  pull-requests: read
  issues: read
  checks: read
  actions: read
  id-token: write
jobs:
  review:
    if: >-
      github.actor != 'github-actions[bot]' &&
      (github.event_name != 'issue_comment' || github.event.issue.pull_request) &&
      (!github.event.pull_request || github.event.pull_request.head.repo.id == github.event.repository.id)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      # Always check out the protected default branch, including review-comment events.
      # The engine fetches exact PR revisions independently into credential-free containers.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - id: trusted
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.SIFT_APP_ID }}
          private-key: ${{ secrets.SIFT_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: write
          permission-issues: read
          permission-checks: read
          permission-actions: read
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.SIFT_WIF_PROVIDER }}
          service_account: ${{ vars.SIFT_GCS_SERVICE_ACCOUNT }}
          create_credentials_file: true
      - uses: timReynolds/sift@REPLACE_WITH_REVIEWED_COMMIT_SHA
        with:
          trusted-ref: ${{ steps.trusted.outputs.sha }}
          read-token: ${{ github.token }}
          write-token: ${{ steps.app.outputs.token }}
          bot-login: ${{ steps.app.outputs.app-slug }}[bot]
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
